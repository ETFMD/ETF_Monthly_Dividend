# GitHub Actions(deploy-counter.yml)가 이 파일로 wrangler.toml 을 만듭니다 — __D1_ID__ 는 자동으로 채워집니다
name = "etfmd-counter"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "__ORIGINS__"

[[d1_databases]]
binding = "DB"
database_name = "etfmd-visitors"
database_id = "__D1_ID__"

[triggers]
crons = ["*/15 * * * *"]  # 15분마다: 시세 수집 실행(GH_TOKEN 있을 때) · 매일 03시대 오래된 해시 정리
