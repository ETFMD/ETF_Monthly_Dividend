name: 시세 데이터 갱신

on:
  schedule:
    - cron: '*/15 0-10 * * 1-5'   # 한국장·분배금 공시 시간 (KST 09:00~19:59)
    - cron: '*/15 13-21 * * 1-5'  # 미국장  (KST 22:00~06:59)
    - cron: '7 */3 * * *'         # 그 외 3시간마다 (환율·공포탐욕·주말)
  workflow_dispatch:              # Actions 탭에서 수동 실행
  push:                           # 수집 스크립트·워크플로가 바뀌면 바로 한 번 실행
    branches: [main]
    paths: ['scripts/update_market_data.py', 'scripts/update_etfdiv.py', 'scripts/etf_tax.py', '.github/workflows/update-market-data.yml']

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: 시세 수집
        run: python3 scripts/update_market_data.py
      - name: ETF 월분배 달력 (거래소 분배금 공시 확인)
        run: python3 scripts/update_etfdiv.py || echo "::warning::ETF 분배 달력 갱신 실패 — 직전 자료 유지"
      - name: 변경된 경우에만 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: 시세 데이터 갱신"
          # 그 사이 다른 실행이 data/ 를 먼저 올렸으면, 같은 파일은 방금 수집한 값(더 최신)으로 덮어 rebase
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
