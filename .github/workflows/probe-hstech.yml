name: 임시 점검 (CORS 프록시 동작)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        run: |
          Y='https%3A%2F%2Fquery1.finance.yahoo.com%2Fv8%2Ffinance%2Fchart%2F%255EKS200%3Finterval%3D1d%26range%3D5d'
          for u in "https://corsproxy.io/?url=$Y" "https://api.allorigins.win/raw?url=$Y" "https://api.allorigins.win/get?url=$Y" "https://api.codetabs.com/v1/proxy?quest=$Y"; do
            for i in 1 2 3; do
              r=$(curl -s -m 20 -H 'Origin: https://d-capitalism.com' -o /tmp/b -w '%{http_code} %{time_total}' "$u"); echo "PX $r $(head -c 70 /tmp/b | tr -d '\n') :: ${u:0:45}"
            done
          done
