name: probe
on:
  push:
    branches: [probe-law4]
    paths: ['scripts/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: timeout 900 python3 scripts/probe.py > probe_out.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -f probe_out.txt; git commit -m out; git push
