name: 아파트 시세 순위 갱신

# 국내 나의 아파트 시세 순위 (data/apt_rank.json) — 국토교통부 아파트 매매 실거래가 (공공데이터포털 API)
#  · 2시간마다(카운터 Worker cron 이 실행): 이번 달·지난달 실거래를 전국 252개 시군구별로 다시 받음 (국토교통부는 신고분을 매일 반영)
#  · 새벽 5~6시 실행: 그 전달까지 3개월 (늦은 신고·계약 해제 반영) · 더 지난 달은 캐시를 씀
#  · 받은 달은 카운터 Worker(/apt/put)에도 올려 단지 그래프에 씀 · 그보다 이전(2006년~)은 data/apt_hist/ 연도 파일로 조금씩 채움
#  · 인증키: 저장소 시크릿 APT_KEY (공공데이터포털 '국토교통부_아파트 매매 실거래가 자료' 일반 인증키)
#  · 공급면적: 같은 키로 '국토교통부_건축HUB_건축물대장정보 서비스' 활용신청 → data/apt_supply.json 에 비싼 단지부터 쌓음
on:
  schedule:
    - cron: '43 20 * * *'      # 한국 05:43 — 3개월 확인 (2시간마다 실행은 카운터 Worker 가 시킴: GitHub 예약 실행은 자주 늦어짐)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_apt_rank.py', '.github/workflows/update-apt-rank.yml']

permissions:
  contents: write

concurrency:
  group: market-data          # 다른 데이터 갱신과 같은 그룹 → data/ 커밋이 겹치지 않음
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APT_KEY: ${{ secrets.APT_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: 지난 실거래 캐시 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .cache/apt
          key: apt-raw-${{ github.run_id }}
          restore-keys: apt-raw-
      - name: 실거래 수집 · 순위 계산
        id: run
        run: |
          if [ -z "$APT_KEY" ]; then echo "::warning::APT_KEY 시크릿이 없어 건너뜁니다"; exit 0; fi
          python3 scripts/update_apt_rank.py
      - name: 실거래 캐시 저장
        if: always() && hashFiles('.cache/apt/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/apt
          key: apt-raw-${{ github.run_id }}
      - name: 변경된 경우에만 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          [ -f data/apt_rank.json ] || exit 0
          git add data/apt_rank.json
          git add data/apt_hist data/apt_supply.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: 아파트 시세 순위 갱신"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
